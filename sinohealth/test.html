<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研发适应症弹窗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 遮罩背景 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* 弹窗容器 */
    .modal-container {
      background: #ffffff;
      width: 500px;
      max-width: 90%;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 弹窗头部 */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #9ca3af;
      cursor: pointer;
      line-height: 1;
      border-radius: 4px;
      padding: 4px;
      transition: all 0.2s;
    }

    .close-btn:hover {
      color: #4b5563;
      background-color: #f3f4f6;
    }

    /* 弹窗主体及表格 */
    .modal-body {
      padding: 16px 24px 24px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .data-table th {
      background-color: #f9fafb;
      color: #4b5563;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
      color: #374151;
    }

    .data-table tbody tr:hover {
      background-color: #f8fafc;
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* 阶段标签（Tag）样式 */
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
    }

    /* 阶段不同颜色状态 */
    .tag-approved {
      background-color: #e6f4ea;
      color: #137333;
    }

    .tag-phase3 {
      background-color: #e8f0fe;
      color: #1a73e8;
    }

    .tag-phase2 {
      background-color: #fef7e0;
      color: #b06000;
    }
  </style>
</head>
<body>

  <!-- 遮罩及弹窗 -->
  <div class="modal-overlay">
    <div class="modal-container">
      
      <!-- 弹窗头部 -->
      <div class="modal-header">
        <h3 class="modal-title">研发适应症</h3>
        <button class="close-btn" title="关闭">&times;</button>
      </div>

      <!-- 弹窗表格 -->
      <div class="modal-body">
        <table class="data-table">
          <thead>
            <tr>
              <th>适应症</th>
              <th style="width: 130px; text-align: center;">最高阶段</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>斑块状银屑病</td>
              <td style="text-align: center;"><span class="tag tag-approved">批准上市</span></td>
            </tr>
            <tr>
              <td>泛发性脓疱型银屑病</td>
              <td style="text-align: center;"><span class="tag tag-phase3">临床3期</span></td>
            </tr>
            <tr>
              <td>溃疡性结肠炎</td>
              <td style="text-align: center;"><span class="tag tag-phase3">临床3期</span></td>
            </tr>
            <tr>
              <td>银屑病关节炎</td>
              <td style="text-align: center;"><span class="tag tag-phase3">临床3期</span></td>
            </tr>
            <tr>
              <td>红皮病性银屑病</td>
              <td style="text-align: center;"><span class="tag tag-phase3">临床3期</span></td>
            </tr>
            <tr>
              <td>克罗恩病</td>
              <td style="text-align: center;"><span class="tag tag-phase2">临床2/3期</span></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

</body>
</html>
