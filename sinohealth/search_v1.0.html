<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球药物情报 - 下拉多选与布局调整</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 搜索主卡片 */
        .search-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 980px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            color: #1d2129;
            font-weight: 600;
        }

        .header p {
            font-size: 13px;
            color: #86909c;
            margin-top: 6px;
        }

        /* 布局表单网格 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }

        .form-item {
            display: flex;
            align-items: center;
        }

        .form-item.full-width {
            grid-column: span 2;
        }

        .label {
            width: 80px;
            font-size: 14px;
            font-weight: 600;
            color: #1d2129;
            text-align: right;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-control {
            width: 100%;
            height: 40px;
            padding: 0 14px;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            font-size: 14px;
            color: #1d2129;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fafafa;
        }

        .input-control.has-tree-btn {
            padding-right: 40px;
        }

        .input-control:focus {
            border-color: #6366f1;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-control::placeholder {
            color: #c9cdd4;
        }

        /* 树形选择按钮 */
        .tree-select-btn {
            position: absolute;
            right: 8px;
            background: transparent;
            border: none;
            color: #86909c;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tree-select-btn:hover {
            color: #6366f1;
            background-color: #f2f3f5;
        }

        /* OR 标签 */
        .or-badge {
            position: absolute;
            left: 8px;
            background: #e0e7ff;
            color: #4338ca;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .input-control.has-or {
            padding-left: 38px;
        }

        /* ========================================================= */
        /* 多选下拉框组件样式                                        */
        /* ========================================================= */
        .multi-select-container {
            position: relative;
            flex: 1;
        }

        .select-trigger {
            min-height: 40px;
            padding: 4px 30px 4px 10px;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            background-color: #fafafa;
            cursor: pointer;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            transition: all 0.2s;
        }

        .select-trigger:hover, .select-trigger.active {
            border-color: #6366f1;
            background-color: #fff;
        }

        .select-placeholder {
            color: #c9cdd4;
            font-size: 14px;
        }

        .selected-tag {
            background: #e0e7ff;
            color: #4338ca;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .selected-tag .remove-tag {
            cursor: pointer;
            font-weight: bold;
            color: #6366f1;
        }

        .select-arrow {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #86909c;
            font-size: 12px;
            pointer-events: none;
        }

        /* 下拉菜单面板 */
        .select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            z-index: 100;
            max-height: 220px;
            overflow-y: auto;
            padding: 6px 0;
            display: none;
        }

        .select-dropdown.show {
            display: block;
        }

        .dropdown-item {
            padding: 8px 14px;
            font-size: 13px;
            color: #1d2129;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background-color: #f2f3f5;
        }

        .dropdown-item input[type="checkbox"] {
            accent-color: #6366f1;
            cursor: pointer;
        }

        /* ========================================================= */
        /* 展开/收起 更多区域控制                                    */
        /* ========================================================= */
        .more-filters {
            grid-column: span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }

        .more-filters.hidden {
            display: none;
        }

        /* 研发状态 - 外框平铺容器 */
        .combo-group-box {
            grid-column: span 2;
            margin-top: 8px;
            margin-bottom: 8px;
            border: 1.5px dashed #a5b4fc;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 22px 20px 18px 20px;
            position: relative;
        }

        .combo-group-box:hover {
            border-color: #6366f1;
        }

        .combo-header {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #ffffff;
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-radius: 10px;
            border: 1px solid #e0e7ff;
        }

        .combo-title {
            font-size: 13px;
            font-weight: 700;
            color: #4338ca;
        }

        .combo-tip {
            font-size: 12px;
            color: #64748b;
        }

        .combo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
            margin-top: 4px;
        }

        .combo-grid .label {
            width: 90px;
            font-size: 13px;
            color: #334155;
        }

        .combo-grid .input-control {
            background-color: #ffffff;
        }

        .combo-grid .select-trigger {
            background-color: #ffffff;
        }

        /* 时间间隔容器 */
        .date-range-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .date-separator {
            color: #86909c;
            font-size: 13px;
        }

        /* AI 智能问答栏 */
        .ai-banner {
            grid-column: span 2;
            background: linear-gradient(90deg, #f5f3ff 0%, #eff6ff 100%);
            border: 1px solid #ddd6fe;
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .ai-text {
            font-size: 13px;
            color: #4c1d95;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-btn {
            background: #7c3aed;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
            transition: background 0.2s;
        }

        .ai-btn:hover {
            background: #6d28d9;
        }

        /* 底部操作按钮 */
        .actions {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            height: 40px;
            padding: 0 28px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-text {
            background: transparent;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="search-card">
    <div class="header">
        <h1>全球新药情报</h1>
        <p>针对药物、靶点、疾病、公司和研究阶段的多维检索管道，实时洞察竞争格局</p>
    </div>

    <div class="form-grid">
        <!-- 默认保留的 4 个基础字段 -->
        <div class="form-item">
            <span class="label">药物</span>
            <div class="input-wrapper">
                <input type="text" class="input-control" placeholder="请输入药物，如：Zilganersen / Rilzabrutinib">
            </div>
        </div>

        <div class="form-item">
            <span class="label">靶点</span>
            <div class="input-wrapper">
                <span class="or-badge">OR</span>
                <input type="text" class="input-control has-or has-tree-btn" placeholder="输入靶点，如：BTK">
                <button class="tree-select-btn" title="选择树形节点">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                </button>
            </div>
        </div>

        <div class="form-item">
            <span class="label">适应症</span>
            <div class="input-wrapper">
                <input type="text" class="input-control has-tree-btn" placeholder="请输入适应症，如：免疫性血小板减少症">
                <button class="tree-select-btn" title="选择树形节点">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                </button>
            </div>
        </div>

        <div class="form-item">
            <span class="label">机构</span>
            <div class="input-wrapper">
                <input type="text" class="input-control has-tree-btn" placeholder="请输入机构，如：恒瑞">
                <button class="tree-select-btn" title="选择树形节点">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                </button>
            </div>
        </div>

        <!-- 展开更多区 -->
        <div class="more-filters hidden" id="moreFilters">
            
            <!-- 调整：药物类型与最高阶段同行 (各自占 1/2 列) -->
            <div class="form-item">
                <span class="label">药物类型</span>
                <div class="input-wrapper">
                    <input type="text" class="input-control has-tree-btn" placeholder="请输入或选择药物类型，如：小分子化药、ADC">
                    <button class="tree-select-btn" title="选择树形节点">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                    </button>
                </div>
            </div>

            <!-- 最高阶段调整为多选下拉框 -->
            <div class="form-item">
                <span class="label">药物最高阶段</span>
                <div class="multi-select-container">
                    <div class="select-trigger" onclick="toggleDropdown(this)">
                        <span class="select-placeholder">请选择最高阶段（可多选）</span>
                        <span class="select-arrow">▼</span>
                    </div>
                    <div class="select-dropdown">
                        <label class="dropdown-item"><input type="checkbox" value="批准上市" onchange="updateTags(this)"> 批准上市</label>
                        <label class="dropdown-item"><input type="checkbox" value="申请上市" onchange="updateTags(this)"> 申请上市</label>
                        <label class="dropdown-item"><input type="checkbox" value="临床3期" onchange="updateTags(this)"> 临床3期</label>
                        <label class="dropdown-item"><input type="checkbox" value="临床2/3期" onchange="updateTags(this)"> 临床2/3期</label>
                        <label class="dropdown-item"><input type="checkbox" value="临床2期" onchange="updateTags(this)"> 临床2期</label>
                        <label class="dropdown-item"><input type="checkbox" value="临床1/2期" onchange="updateTags(this)"> 临床1/2期</label>
                        <label class="dropdown-item"><input type="checkbox" value="早期临床1期" onchange="updateTags(this)"> 早期临床1期</label>
                        <label class="dropdown-item"><input type="checkbox" value="临床前" onchange="updateTags(this)"> 临床前</label>
                    </div>
                </div>
            </div>

            <!-- 研发状态 外框平铺容器 -->
            <div class="combo-group-box">
                <div class="combo-header">
                    <span style="color:#6366f1;">⚙️</span>
                    <span class="combo-title">研发状态</span>
                    <span class="combo-tip"></span>
                </div>

                <div class="combo-grid">
                    <div class="form-item">
                        <span class="label">研发适应症</span>
                        <div class="input-wrapper">
                            <input type="text" class="input-control has-tree-btn" placeholder="如：非小细胞肺癌">
                            <button class="tree-select-btn" title="选择树形节点">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-item">
                        <span class="label">机构</span>
                        <div class="input-wrapper">
                            <input type="text" class="input-control has-tree-btn" placeholder="如：恒瑞">
                            <button class="tree-select-btn" title="选择树形节点">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-item">
                        <span class="label">国家/地区</span>
                        <div class="input-wrapper">
                            <input type="text" class="input-control" placeholder="如：中国 / 美国">
                        </div>
                    </div>

                    <!-- 互换位置：适应症最高阶段 移至原日期位置 (下拉多选) -->
                    <div class="form-item">
                        <span class="label">适应症最高阶段</span>
                        <div class="multi-select-container">
                            <div class="select-trigger" onclick="toggleDropdown(this)">
                                <span class="select-placeholder">请选择适应症最高阶段（可多选）</span>
                                <span class="select-arrow">▼</span>
                            </div>
                            <div class="select-dropdown">
                                <label class="dropdown-item"><input type="checkbox" value="批准上市" onchange="updateTags(this)"> 批准上市</label>
                                <label class="dropdown-item"><input type="checkbox" value="申请上市" onchange="updateTags(this)"> 申请上市</label>
                                <label class="dropdown-item"><input type="checkbox" value="临床3期" onchange="updateTags(this)"> 临床3期</label>
                                <label class="dropdown-item"><input type="checkbox" value="临床2/3期" onchange="updateTags(this)"> 临床2/3期</label>
                                <label class="dropdown-item"><input type="checkbox" value="临床2期" onchange="updateTags(this)"> 临床2期</label>
                                <label class="dropdown-item"><input type="checkbox" value="临床1/2期" onchange="updateTags(this)"> 临床1/2期</label>
                                <label class="dropdown-item"><input type="checkbox" value="早期临床1期" onchange="updateTags(this)"> 早期临床1期</label>
                                <label class="dropdown-item"><input type="checkbox" value="临床前" onchange="updateTags(this)"> 临床前</label>
                            </div>
                        </div>
                    </div>

                    <!-- 互换位置：研发日期 移至原组合阶段位置 -->
                    <div class="form-item full-width">
                        <span class="label">研发日期</span>
                        <div class="date-range-wrapper">
                            <input type="date" class="input-control" style="color: #64748b;">
                            <span class="date-separator">至</span>
                            <input type="date" class="input-control" style="color: #64748b;">
                        </div>
                    </div>

                </div>
            </div>

            <!-- AI 智能问答栏 -->
            <div class="ai-banner">
                <div class="ai-text">
                    <span>✨ 需要更复杂的跨国/多条件对比检索？（例如：“在中国做 3 期但在美国已上市的药物”）</span>
                </div>
                <button class="ai-btn">
                    <span>👉 点击使用 AI 智能问答</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 底部操作按钮 -->
    <div class="actions">
        <button class="btn btn-primary">🔍 搜索</button>
        <button class="btn btn-secondary">🔄 重置筛选</button>
        <button class="btn btn-text" id="toggleBtn" onclick="toggleMoreFilters()">
            <span id="toggleText">展开更多条件</span>
            <span id="toggleIcon">⌄</span>
        </button>
    </div>
</div>

<script>
    // 展开/收起 逻辑
    function toggleMoreFilters() {
        const moreFilters = document.getElementById('moreFilters');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');

        if (moreFilters.classList.contains('hidden')) {
            moreFilters.classList.remove('hidden');
            toggleText.textContent = '收起条件';
            toggleIcon.textContent = '⌃';
        } else {
            moreFilters.classList.add('hidden');
            toggleText.textContent = '展开更多条件';
            toggleIcon.textContent = '⌄';
        }
    }

    // 多选下拉框 切换开合
    function toggleDropdown(trigger) {
        const dropdown = trigger.nextElementSibling;
        const isOpen = dropdown.classList.contains('show');
        
        // 关闭其它已打开的下拉
        document.querySelectorAll('.select-dropdown').forEach(d => d.classList.remove('show'));
        document.querySelectorAll('.select-trigger').forEach(t => t.classList.remove('active'));

        if (!isOpen) {
            dropdown.classList.add('show');
            trigger.classList.add('active');
        }
    }

    // 更新已选标签 UI
    function updateTags(checkbox) {
        const container = checkbox.closest('.multi-select-container');
        const trigger = container.querySelector('.select-trigger');
        const placeholder = trigger.querySelector('.select-placeholder');
        const checkedBoxes = container.querySelectorAll('input[type="checkbox"]:checked');

        // 清空既有标签（保留 arrow & placeholder 结构）
        trigger.querySelectorAll('.selected-tag').forEach(tag => tag.remove());

        if (checkedBoxes.length > 0) {
            if (placeholder) placeholder.style.display = 'none';
            checkedBoxes.forEach(cb => {
                const tag = document.createElement('span');
                tag.className = 'selected-tag';
                tag.innerHTML = `${cb.value} <span class="remove-tag" onclick="removeTag(event, this, '${cb.value}')">×</span>`;
                trigger.insertBefore(tag, trigger.querySelector('.select-arrow'));
            });
        } else {
            if (placeholder) placeholder.style.display = 'inline';
        }
    }

    // 移除单个已选标签
    function removeTag(event, element, val) {
        event.stopPropagation(); // 阻止触发下拉开关
        const container = element.closest('.multi-select-container');
        const checkbox = container.querySelector(`input[value="${val}"]`);
        if (checkbox) {
            checkbox.checked = false;
            updateTags(checkbox);
        }
    }

    // 点击页面空白处收起所有下拉菜单
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.multi-select-container')) {
            document.querySelectorAll('.select-dropdown').forEach(d => d.classList.remove('show'));
            document.querySelectorAll('.select-trigger').forEach(t => t.classList.remove('active'));
        }
    });
</script>

</body>
</html>
