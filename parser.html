<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HTML 沙盒 · 即时预览 + GitHub 版本控制</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: 'hsl(var(--border))',
                        input: 'hsl(var(--input))',
                        ring: 'hsl(var(--ring))',
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
                        secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
                        destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
                        muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
                        accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
                        card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
                    }
                }
            }
        }
    </script>
    <style>
        @layer base {
            :root {
                --background: 0 0% 100%;
                --foreground: 240 10% 3.9%;
                --card: 0 0% 100%;
                --card-foreground: 240 10% 3.9%;
                --popover: 0 0% 100%;
                --popover-foreground: 240 10% 3.9%;
                --primary: 240 5.9% 10%;
                --primary-foreground: 0 0% 98%;
                --secondary: 240 4.8% 95.9%;
                --secondary-foreground: 240 5.9% 10%;
                --muted: 240 4.8% 95.9%;
                --muted-foreground: 240 3.8% 46.1%;
                --accent: 240 4.8% 95.9%;
                --accent-foreground: 240 5.9% 10%;
                --destructive: 0 84.2% 60.2%;
                --destructive-foreground: 0 0% 98%;
                --border: 240 5.9% 90%;
                --input: 240 5.9% 90%;
                --ring: 240 5.9% 10%;
            }
            .dark {
                --background: 240 10% 3.9%;
                --foreground: 0 0% 98%;
                --card: 240 10% 3.9%;
                --card-foreground: 0 0% 98%;
                --popover: 240 10% 3.9%;
                --popover-foreground: 0 0% 98%;
                --primary: 0 0% 98%;
                --primary-foreground: 240 5.9% 10%;
                --secondary: 240 3.7% 15.9%;
                --secondary-foreground: 0 0% 98%;
                --muted: 240 3.7% 15.9%;
                --muted-foreground: 240 5% 64.9%;
                --accent: 240 3.7% 15.9%;
                --accent-foreground: 0 0% 98%;
                --destructive: 0 62.8% 30.6%;
                --destructive-foreground: 0 0% 98%;
                --border: 240 3.7% 15.9%;
                --input: 240 3.7% 15.9%;
                --ring: 240 4.9% 83.9%;
            }
        }
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        textarea::-webkit-scrollbar, div::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        textarea::-webkit-scrollbar-thumb, div::-webkit-scrollbar-thumb {
            background: hsl(var(--muted-foreground) / 0.3);
            border-radius: 4px;
        }
    </style>
    <!-- Mammoth.js 用于解析 .docx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">

<!-- 顶部导航栏 -->
<header class="flex items-center justify-between px-6 py-3 border-b border-border bg-card/50 backdrop-blur z-20">
    <div class="flex flex-col">
        <h1 class="text-base font-bold tracking-tight bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">
            HTML 沙盒实验室
        </h1>
        <p class="text-xs text-muted-foreground">粘贴或拖拽文件 | 实时渲染 | GitHub 版本控制</p>
    </div>
    <div class="flex items-center gap-3">
        <!-- 状态提示 -->
        <div id="statusMsg" class="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">
            ✅ 就绪
        </div>
        <!-- 主题切换按钮 -->
        <button id="themeToggleBtn" title="切换主题" class="inline-flex items-center justify-center w-8 h-8 rounded-md border border-input bg-background text-foreground shadow-sm hover:bg-accent hover:text-accent-foreground transition-colors">
            <!-- 太阳/月亮图标 -->
            <svg id="themeIconSun" class="w-4 h-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg id="themeIconMoon" class="w-4 h-4 block dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <!-- GitHub 设置/上传按钮 -->
        <button id="settingsBtn" title="GitHub 上传配置" class="inline-flex items-center justify-center w-8 h-8 rounded-md border border-input bg-background text-foreground shadow-sm hover:bg-accent hover:text-accent-foreground transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        </button>
    </div>
</header>

<!-- 主工作区 -->
<div class="flex flex-1 overflow-hidden relative" id="mainPanel">
    <!-- 编辑器容器 -->
    <div class="flex flex-col bg-background relative" id="editorContainer" style="width: 40%;">
        <!-- 编辑器头部：左侧清空，右侧新增复制 -->
        <div class="flex items-center justify-between px-4 py-2 bg-muted/40 border-b border-border select-none text-xs">
            <!-- 左侧：清空按钮 + 标题 -->
            <div class="flex items-center gap-2">

                <span class="flex items-center gap-1.5 font-semibold text-foreground">
                    <svg class="w-3.5 h-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    编辑器
                </span>
            </div>
            <!-- 右侧：复制按钮 -->

            <div class="flex items-center gap-2">
                <button id="clearBtn" title="清空代码" class="inline-flex items-center justify-center w-7 h-7 rounded-md border border-input bg-background text-destructive hover:bg-destructive hover:text-destructive-foreground transition-colors shadow-sm">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                </button>
                <button id="copyBtn" title="复制代码" class="inline-flex items-center justify-center w-7 h-7 rounded-md border border-input bg-background text-muted-foreground hover:text-foreground hover:bg-green-500 transition-colors shadow-sm">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
            </div>
        </div>

        <!-- 带有行号的输入核心 -->
        <div class="flex-1 p-3 bg-background flex relative overflow-hidden" id="dropZone">
            <!-- 拖拽提示层 -->
            <div id="dragOverlay" class="hidden absolute inset-3 bg-blue-500/10 border-2 border-dashed border-blue-500 rounded-xl z-10 flex-col items-center justify-center text-blue-500 font-semibold gap-2 pointer-events-none">
                <svg class="w-8 h-8 animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                <span>松开鼠标导入文件内容 (.html, .docx, .txt)</span>
            </div>
            
            <div class="flex w-full h-full border border-input rounded-xl overflow-hidden bg-input/20">
                <!-- 行号 -->
                <div id="lineNumbers" class="w-12 bg-muted/50 border-r border-border py-3 pr-2 font-mono text-xs text-muted-foreground text-right select-none overflow-hidden leading-relaxed">1</div>
                <!-- 文本域 -->
                <textarea id="htmlCode" spellcheck="false" placeholder="在此输入 HTML 代码，或拖入文件..." class="flex-1 h-full bg-transparent text-foreground border-none p-3 font-mono text-xs leading-relaxed resize-none outline-none whitespace-pre"></textarea>
            </div>
        </div>
    </div>

    <!-- 拖拽分隔条 -->
    <div class="w-1.5 bg-border hover:bg-blue-500/50 cursor-ew-resize transition-colors z-10 relative" id="resizer"></div>

    <!-- 预览容器 -->
    <div class="flex flex-col bg-card relative flex-1" id="previewContainer">
        <div class="flex items-center justify-between px-4 py-2 bg-muted/40 border-b border-border select-none text-xs">
            <span class="flex items-center gap-1.5 font-semibold text-foreground">
                <svg class="w-3.5 h-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                实时预览
            </span>
<button id="openNewTabBtn" title="在新标签页中打开"
        class="inline-flex items-center gap-1.5 h-7 px-3 rounded-md border border-input bg-background text-muted-foreground hover:text-foreground hover:bg-green-500 transition-colors shadow-sm font-medium">
    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"/>
        <path d="M10 14 21 3"/>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    </svg>
    新标签页打开
</button>
        </div>
        <div class="flex-1 m-3 rounded-xl overflow-hidden border border-border bg-white shadow-sm relative">
            <iframe id="previewFrame" title="live preview" class="w-full h-full border-none bg-white" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
        </div>
    </div>
</div>

<!-- GitHub 设置模态框 -->
<div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-card text-card-foreground border border-border rounded-2xl w-full max-w-lg p-6 shadow-2xl">
        <h3 class="text-base font-semibold mb-4 flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            GitHub 配置与操作
        </h3>
        <div class="space-y-3 text-xs">
            <div>
                <label class="block font-medium mb-1 text-muted-foreground">🔑 GitHub Token (需 repo 权限)</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxx 或 github_pat_xxxx" class="w-full bg-input border border-input rounded-lg px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-ring">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-medium mb-1 text-muted-foreground">👤 仓库所有者</label>
                    <input type="text" id="repoOwner" placeholder="用户名/组织" value="A1ando" class="w-full bg-input border border-input rounded-lg px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-ring">
                </div>
                <div>
                    <label class="block font-medium mb-1 text-muted-foreground">📁 仓库名称</label>
                    <input type="text" id="repoName" placeholder="repo-name" value="design" class="w-full bg-input border border-input rounded-lg px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-ring">
                </div>
            </div>
            <div>
                <label class="block font-medium mb-1 text-muted-foreground">📂 文件路径</label>
                <input type="text" id="filePath" placeholder="例如: index.html 或 subfolder/test.html" class="w-full bg-input border border-input rounded-lg px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-ring">
            </div>
            <div>
                <label class="block font-medium mb-1 text-muted-foreground">✍️ 提交描述 (Commit Message)</label>
                <textarea id="commitMessage" rows="2" placeholder="更新 HTML 内容" class="w-full bg-input border border-input rounded-lg px-3 py-2 text-foreground focus:outline-none focus:ring-1 focus:ring-ring resize-none"></textarea>
            </div>
        </div>
        <div class="flex justify-end gap-2.5 mt-5">
            <button id="cancelModalBtn" class="px-4 py-2 rounded-lg border border-input bg-background hover:bg-accent text-xs font-medium transition-colors">取消</button>
            <button id="saveAndUploadBtn" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium transition-colors shadow-sm">保存并上传</button>
        </div>
    </div>
</div>

<script>
    // DOM 元素引用
    const htmlCodeArea = document.getElementById('htmlCode');
    const lineNumbersEle = document.getElementById('lineNumbers');
    const previewFrame = document.getElementById('previewFrame');
    const statusDiv = document.getElementById('statusMsg');
    const settingsBtn = document.getElementById('settingsBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const modal = document.getElementById('settingsModal');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const saveAndUploadBtn = document.getElementById('saveAndUploadBtn');
    const openNewTabBtn = document.getElementById('openNewTabBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const dropZone = document.getElementById('dropZone');
    const dragOverlay = document.getElementById('dragOverlay');
    
    const editorContainer = document.getElementById('editorContainer');
    const previewContainer = document.getElementById('previewContainer');
    const resizer = document.getElementById('resizer');
    
    // Modal 输入框
    const tokenInput = document.getElementById('githubToken');
    const ownerInput = document.getElementById('repoOwner');
    const repoNameInput = document.getElementById('repoName');
    const filePathInput = document.getElementById('filePath');
    const commitMsgTextarea = document.getElementById('commitMessage');

    let currentConfig = { token: '', owner: 'A1ando', repo: 'design', filePath: '', commitMessage: '' };

    // ---------- 1. 拖拽调整布局 ----------
    let startX;
    function onMouseMove(e) {
        const containerRect = document.getElementById('mainPanel').getBoundingClientRect();
        const newEditorWidth = e.clientX - containerRect.left - (resizer.offsetWidth / 2);
        if (newEditorWidth > 200 && newEditorWidth < containerRect.width - 200) {
            editorContainer.style.width = newEditorWidth + 'px';
            previewContainer.style.width = (containerRect.width - newEditorWidth - resizer.offsetWidth) + 'px';
        }
    }
    
    function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        const mainRect = document.getElementById('mainPanel').getBoundingClientRect();
        localStorage.setItem('editor_ratio', editorContainer.offsetWidth / mainRect.width);
    }
    
    function initLayout() {
        const mainRect = document.getElementById('mainPanel').getBoundingClientRect();
        const savedRatio = localStorage.getItem('editor_ratio') || 0.4;
        const newEditorWidth = mainRect.width * parseFloat(savedRatio);
        
        editorContainer.style.width = newEditorWidth + 'px';

        resizer.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            document.body.style.cursor = 'ew-resize';
            document.body.style.userSelect = 'none';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
            e.preventDefault();
        });
    }

    // ---------- 2. 行号与同步滚动 ----------
    function updateLineNumbers() {
        const lines = htmlCodeArea.value.split('\n');
        const lineCount = Math.max(1, lines.length);
        let arr = [];
        for (let i = 1; i <= lineCount; i++) arr.push(i);
        lineNumbersEle.innerHTML = arr.join('<br>');
    }

    htmlCodeArea.addEventListener('scroll', () => {
        lineNumbersEle.scrollTop = htmlCodeArea.scrollTop;
    });

    // ---------- 3. 文件拖拽读取系统 (含 docx) ----------
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dragOverlay.classList.remove('hidden'), false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dragOverlay.classList.add('hidden'), false);
    });

    dropZone.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            const file = files[0];
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'docx') {
                showStatus(`⏳ 正在解析 Word 文档: ${file.name}...`);
                const reader = new FileReader();
                reader.onload = function(event) {
                    mammoth.convertToHtml({ arrayBuffer: event.target.result })
                        .then(result => {
                            htmlCodeArea.value = result.value;
                            updateLineNumbers();
                            updatePreview();
                            showStatus(`📂 已成功导入 Word 文档: ${file.name}`);
                        })
                        .catch(err => showStatus(`❌ Word 解析失败`, true));
                };
                reader.readAsArrayBuffer(file);
            } else if (['html', 'txt', 'json', 'md'].includes(ext)) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    htmlCodeArea.value = event.target.result;
                    updateLineNumbers();
                    updatePreview();
                    showStatus(`📂 已成功导入文件: ${file.name}`);
                };
                reader.readAsText(file);
            } else {
                showStatus('❌ 仅支持 .html, .txt, .json, .md, .docx 格式', true);
            }
        }
    });

    // ---------- 4. 清空与复制功能 ----------
    function clearEditor() {
        htmlCodeArea.value = '';
        updateLineNumbers();
        updatePreview();
        showStatus('🧹 内容已清空');
    }

    function copyCode() {
        const code = htmlCodeArea.value;
        if (!code.trim()) {
            showStatus('没有可复制的内容', true);
            return;
        }
        navigator.clipboard.writeText(code).then(() => {
            showStatus('📋 代码已成功复制到剪贴板');
        }).catch(() => showStatus('❌ 复制失败', true));
    }

    clearBtn.addEventListener('click', clearEditor);
    copyBtn.addEventListener('click', copyCode);

    // ---------- 5. 主题切换逻辑 ----------
    function initTheme() {
        const savedTheme = localStorage.getItem('preview_theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    }
    
    function toggleTheme() {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('preview_theme', 'light');
            showStatus('☀️ 已切换至浅色主题');
        } else {
            document.documentElement.classList.add('dark');
            localStorage.setItem('preview_theme', 'dark');
            showStatus('🌙 已切换至深色主题');
        }
    }
    themeToggleBtn.addEventListener('click', toggleTheme);

    // ---------- 6. 状态提示与 GitHub API ----------
    let activeStatusText = '';
    function showStatus(msg, isError = false) {
        statusDiv.classList.remove('hidden');
        activeStatusText = msg;
        statusDiv.innerHTML = isError ? `❌ ${msg}` : `✅ ${msg}`;
        statusDiv.className = `hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border ${
            isError ? 'bg-red-500/10 text-red-500 border-red-500/20' : 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20'
        }`;

        setTimeout(() => {
            if (statusDiv.textContent.includes(activeStatusText)) {
                statusDiv.innerHTML = '✅ 就绪';
                statusDiv.className = 'hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-500 border border-emerald-500/20';
            }
        }, 5000);
    }

    function normalizeFilePath(path) {
        let trimmed = path.trim();
        if (!trimmed) return '';
        return trimmed.toLowerCase().endsWith('.html') ? trimmed : trimmed + '.html';
    }

    function utf8ToBase64(str) {
        return btoa(String.fromCharCode(...new TextEncoder().encode(str)));
    }

    async function getExistingFileSha(owner, repo, path, token) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
        const res = await fetch(url, { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
        if (res.status === 200) return (await res.json()).sha;
        if (res.status === 404) return null;
        throw new Error(`获取文件异常 (${res.status})`);
    }

    async function saveToGitHub(owner, repo, path, content, commitMessage, token) {
        const sha = await getExistingFileSha(owner, repo, path, token);
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
        const payload = { message: commitMessage, content: utf8ToBase64(content) };
        if (sha) payload.sha = sha;
        
        const res = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`上传失败 ${res.status}: ${await res.text()}`);
        return await res.json();
    }

    function updatePreview() {
        const code = htmlCodeArea.value;
        try {
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open(); doc.write(code); doc.close();
        } catch (err) {
            previewFrame.srcdoc = code;
        }
    }

    function loadConfigFromLocal() {
        const saved = localStorage.getItem('parser_config');
        if (saved) {
            try {
                currentConfig = JSON.parse(saved);
                tokenInput.value = currentConfig.token || '';
                ownerInput.value = currentConfig.owner || 'A1ando';
                repoNameInput.value = currentConfig.repo || 'design';
                filePathInput.value = currentConfig.filePath || '';
                commitMsgTextarea.value = currentConfig.commitMessage || '';
            } catch(e){}
        }
    }

    async function handleSaveAndUpload() {
        currentConfig = { 
            token: tokenInput.value.trim(), 
            owner: ownerInput.value.trim(), 
            repo: repoNameInput.value.trim(), 
            filePath: filePathInput.value.trim(), 
            commitMessage: commitMsgTextarea.value.trim() 
        };
        localStorage.setItem('parser_config', JSON.stringify(currentConfig));
        
        if (!currentConfig.token || !currentConfig.filePath) { 
            showStatus('Token 及文件路径不能为空', true); 
            return; 
        }
        
        let path = normalizeFilePath(currentConfig.filePath);
        saveAndUploadBtn.disabled = true;
        saveAndUploadBtn.innerText = '⏳ 上传中...';
        
        showStatus(`正在上传文件至仓库 ${currentConfig.owner}/${currentConfig.repo}...`);

        try {
            const result = await saveToGitHub(currentConfig.owner, currentConfig.repo, path, htmlCodeArea.value, currentConfig.commitMessage || '更新 HTML 内容', currentConfig.token);
            showStatus(`上传成功！<a href="${result.commit.html_url}" target="_blank" class="underline text-blue-400">查看提交</a>`);
            modal.classList.add('hidden');
        } catch (err) {
            showStatus(err.message, true);
        } finally {
            saveAndUploadBtn.disabled = false; 
            saveAndUploadBtn.innerText = '保存并上传';
        }
    }

    function openInNewTab() {
        const code = htmlCodeArea.value;
        if (code.trim()) {
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            window.open(URL.createObjectURL(blob), '_blank');
        } else {
            showStatus('没有可导出的内容', true);
        }
    }

    // 事件监听
    let previewTimeout;
    htmlCodeArea.addEventListener('input', () => {
        updateLineNumbers();
        clearTimeout(previewTimeout);
        previewTimeout = setTimeout(updatePreview, 30);
    });

    settingsBtn.addEventListener('click', () => modal.classList.remove('hidden'));
    cancelModalBtn.addEventListener('click', () => modal.classList.add('hidden'));
    saveAndUploadBtn.addEventListener('click', handleSaveAndUpload);
    openNewTabBtn.addEventListener('click', openInNewTab);
    window.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });

    // 初始化执行
    loadConfigFromLocal();
    initTheme();
    updateLineNumbers();
    updatePreview();
    initLayout();
</script>
</body>
</html>
